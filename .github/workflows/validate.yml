name: Native validation

on:
  workflow_dispatch:
  schedule:
    - cron: '15 3 * * 1'

permissions:
  contents: read

jobs:
  validate:
    if: ${{ vars.JOYEER_NATIVE_RUNNERS == 'enabled' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: Windows
            arch: X64
            developer_arch: x64
          - os: Windows
            arch: ARM64
            developer_arch: arm64
          - os: Linux
            arch: X64
          - os: Linux
            arch: ARM64
          - os: macOS
            arch: ARM64
    runs-on: [self-hosted, '${{ matrix.os }}', '${{ matrix.arch }}', joyeer-native]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate POSIX build
        if: runner.os != 'Windows'
        shell: bash
        run: python3 scripts/validate.py --no-retry --report validation.md
      - name: Validate Windows build
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          if not defined JOYEER_VCVARSALL exit /b 1
          call "%JOYEER_VCVARSALL%" ${{ matrix.developer_arch }} || exit /b 1
          python scripts\validate.py --no-retry --report validation.md
      - name: Publish POSIX validation summary
        if: always() && runner.os != 'Windows'
        shell: bash
        run: |
          if test -f validation.md; then
            cat validation.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Publish Windows validation summary
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: |
          if (Test-Path -LiteralPath validation.md) {
            Get-Content -LiteralPath validation.md | Add-Content -Encoding utf8 -LiteralPath $env:GITHUB_STEP_SUMMARY
          }
