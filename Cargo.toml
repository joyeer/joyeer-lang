[workspace]
resolver = "2"
members = [
    "compiler/joyeer_span",
    "compiler/joyeer_errors",
    "compiler/joyeer_lexer",
    "compiler/joyeer_ast",
    "compiler/joyeer_parse",
    "compiler/joyeer_interp",
    "compiler/joyeer_driver",
    "compiler/joyeer",
]

# The frozen C++ tree and build outputs are not Cargo packages; keep any stray
# manifests that might appear there out of the workspace.
exclude = ["build", "out"]

[workspace.package]
version = "0.0.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
# Internal crates, referenced as `foo.workspace = true` from members.
joyeer_span = { path = "compiler/joyeer_span" }
joyeer_errors = { path = "compiler/joyeer_errors" }
joyeer_lexer = { path = "compiler/joyeer_lexer" }
joyeer_ast = { path = "compiler/joyeer_ast" }
joyeer_parse = { path = "compiler/joyeer_parse" }
joyeer_interp = { path = "compiler/joyeer_interp" }
joyeer_driver = { path = "compiler/joyeer_driver" }
