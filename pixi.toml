[workspace]
name = "joyeer"
channels = ["conda-forge"]
platforms = ["win-64", "linux-64", "linux-aarch64", "osx-64", "osx-arm64"]
requires-pixi = "==0.73.0"

[dependencies]
python = "3.12.*"
cmake = "==4.4.0"
ninja = "==1.13.2"
clang = "==22.1.8"
clangxx = "==22.1.8"
lld = "==22.1.8"
llvm-tools = "==22.1.8"

# Windows uses system MSVC; macOS uses the Clang dependency above.
[target.linux.dependencies]
gcc = "==15.2.0"
gxx = "==15.2.0"
